name: CI with Checkmarx Scan

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  build-test-and-checkmarx:
    name: Build, Test and Checkmarx Scan
    runs-on: ubuntu-latest

    env:
      CX_BASE_URI: ${{ secrets.CX_BASE_URI }}
      CX_TENANT: ${{ secrets.CX_TENANT }}
      CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
      CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js for demo app
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Check Checkmarx secret configuration
        shell: bash
        run: |
          echo "Checking Checkmarx secret configuration..."

          if [ -z "$CX_BASE_URI" ]; then
            echo "CX_BASE_URI is not configured."
          else
            echo "CX_BASE_URI is configured."
          fi

          if [ -z "$CX_TENANT" ]; then
            echo "CX_TENANT is not configured."
          else
            echo "CX_TENANT is configured."
          fi

          if [ -z "$CX_CLIENT_ID" ]; then
            echo "CX_CLIENT_ID is not configured."
          else
            echo "CX_CLIENT_ID is configured."
          fi

          if [ -z "$CX_CLIENT_SECRET" ]; then
            echo "CX_CLIENT_SECRET is not configured."
          else
            echo "CX_CLIENT_SECRET is configured."
          fi

      - name: Run Checkmarx One scan
        if: ${{ env.CX_BASE_URI != '' && env.CX_TENANT != '' && env.CX_CLIENT_ID != '' && env.CX_CLIENT_SECRET != '' }}
        uses: Checkmarx/ast-github-action@2.3.36
        with:
          base_uri: ${{ env.CX_BASE_URI }}
          cx_tenant: ${{ env.CX_TENANT }}
          cx_client_id: ${{ env.CX_CLIENT_ID }}
          cx_client_secret: ${{ env.CX_CLIENT_SECRET }}
          project_name: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          scan_params: >-
            --scan-types sast,sca
