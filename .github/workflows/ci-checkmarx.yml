name: CI with Checkmarx Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-test-and-checkmarx:
    name: Build, Test and Checkmarx Scan
    runs-on: ubuntu-latest

    env:
      CX_BASE_URI: ${{ secrets.CX_BASE_URI }}
      CX_TENANT: ${{ secrets.CX_TENANT }}
      CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
      CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Checkmarx One scan
        if: ${{ env.CX_BASE_URI != '' && env.CX_TENANT != '' && env.CX_CLIENT_ID != '' && env.CX_CLIENT_SECRET != '' }}
        uses: Checkmarx/ast-github-action@2.3.36
        with:
          base_uri: ${{ env.CX_BASE_URI }}
          cx_tenant: ${{ env.CX_TENANT }}
          cx_client_id: ${{ env.CX_CLIENT_ID }}
          cx_client_secret: ${{ env.CX_CLIENT_SECRET }}
          project_name: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          additional_params: >-
            --scan-types sast,sca
            --report-format sarif
            --output-path .

      - name: Upload Checkmarx SARIF report to GitHub Security
        if: ${{ always() && hashFiles('cx_result.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cx_result.sarif
